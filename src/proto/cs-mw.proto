syntax = "proto3";

option go_package = "mini/proto";

package mini;

// #TODO: remove if working
message ChoiceBiRequest {
        string Option1 = 1;
        string Option2 = 2;
}

message ChoiceReply {
    string Option = 1;
    int32 ReplyID = 2;
}

message Matrix {
    repeated Row Rows = 1;
}

message Row {
    repeated int32 Values = 1;
}

message ConvolutionFrontRequest {
    Matrix Target = 1;
    Matrix Kernel = 2;
}

message ConvolutionFrontReply {
    Matrix Result = 1;
    int32 ID = 2;
}

message ConvolutionBackRequest {
    Matrix Target = 1;
    Matrix Kernel = 2;
    int32 ID = 3;
}

message ConvolutionBackReply {
    Matrix Result = 1;
    int32 ID = 2;
}

message NotifyRequest {
        string WorkerAddress = 1;
    }

message NotifyReply {
    string Result = 1;
}

service Front {
    // #TODO: remove if working
    rpc Choice(ChoiceBiRequest) returns (ChoiceReply) {}
    rpc Convulution(ConvolutionFrontRequest) returns (ConvolutionFrontReply) {}
}

service Back {
    // #TODO: remove if working
    rpc Choice(ChoiceBiRequest) returns (ChoiceReply) {}
    rpc Convulution(ConvolutionBackRequest) returns (ConvolutionBackReply) {}
}

service Master {
    rpc NotifyActiveWorker(NotifyRequest) returns (NotifyReply) {}
    rpc NotifyDeactiveWorker(NotifyRequest) returns (NotifyReply) {}
    rpc NotifyPing(NotifyRequest) returns (NotifyReply) {}
}
