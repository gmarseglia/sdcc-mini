syntax = "proto3";

option go_package = "mini/proto";

package mini;

// #TODO: remove if working
message ChoiceBiRequest {
        string Option1 = 1;
        string Option2 = 2;
}

message ChoiceReply {
    string Option = 1;
    int32 ReplyID = 2;
}

message Matrix {
    repeated Row Rows = 1;
}

message Row {
    repeated float Values = 1;
}

message ConvolutionFrontRequest {
    Matrix Target = 1;
    repeated Matrix Kernel = 2;
    int32 StrideHorizontal = 3;
    int32 StrideVertical = 4;
}

message ConvolutionFrontReply {
    repeated Matrix Result = 1;
    int32 ID = 2;
}

message MaxPoolFrontRequest {
    Matrix Target = 1;
    int32 Size = 2;
}

message MaxPoolFrontReply {
    Matrix Result = 1;
    int32 ID = 2;
}

message ConvolutionBackRequest {
    Matrix Target = 1;
    repeated Matrix Kernel = 2;
    int32 StrideHorizontal = 3;
    int32 StrideVertical = 4;
    int32 ID = 5;
}

message ConvolutionBackReply {
    repeated Matrix Result = 1;
    int32 ID = 2;
}

message MaxPoolBackRequest {
    Matrix Target = 1;
    int32 Size = 2;
    int32 ID = 3;
}

message MaxPoolBackReply {
    Matrix Result = 1;
    int32 ID = 2;
}

message NotifyRequest {
        string WorkerAddress = 1;
    }

message NotifyReply {
    string Result = 1;
}

service Front {
    // #TODO: remove if working
    rpc Choice(ChoiceBiRequest) returns (ChoiceReply) {}
    rpc Convulution(ConvolutionFrontRequest) returns (ConvolutionFrontReply) {}
    rpc MaxPool(MaxPoolFrontRequest) returns (MaxPoolFrontReply) {}
}

service Back {
    // #TODO: remove if working
    rpc Choice(ChoiceBiRequest) returns (ChoiceReply) {}
    rpc Convulution(ConvolutionBackRequest) returns (ConvolutionBackReply) {}
    rpc MaxPool(MaxPoolBackRequest) returns (MaxPoolBackReply) {}
}

service Master {
    rpc NotifyActiveWorker(NotifyRequest) returns (NotifyReply) {}
    rpc NotifyDeactiveWorker(NotifyRequest) returns (NotifyReply) {}
    rpc NotifyPing(NotifyRequest) returns (NotifyReply) {}
}
