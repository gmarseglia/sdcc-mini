syntax = "proto3";

option go_package = "mini/proto";

package mini;

// #TODO: remove if working
message ChoiceBiRequest {
        string Option1 = 1;
        string Option2 = 2;
}

message ChoiceReply {
    string Option = 1;
    int32 ReplyID = 2;
}

message Matrix {
    repeated Row Rows = 1;
}

message Row {
    repeated float Values = 1;
}

message ConvolutionalLayerFrontRequest {
    Matrix Target = 1;
    repeated Matrix Kernel = 2;
    int32 AvgPoolSize = 3;
    bool UseKernels = 4;
    bool UseSigmoid = 5;
}

message ConvolutionalLayerFrontReply {
    repeated Matrix Result = 1;
    int32 ID = 2;
}

message ConvolutionalLayerBackRequest {
    Matrix Target = 1;
    repeated Matrix Kernel = 2;
    int32 AvgPoolSize = 3;
    bool UseKernels = 5;
    bool UseSigmoid = 6;
    int32 ID = 7;
}

message ConvolutionalLayerBackReply {
    repeated Matrix Result = 1;
    int32 ID = 2;
}

message NotifyRequest {
        string WorkerAddress = 1;
    }

message NotifyReply {
    string Result = 1;
}

service Front {
    // #TODO: remove if working
    rpc Choice(ChoiceBiRequest) returns (ChoiceReply) {}
    rpc ConvolutionalLayer(ConvolutionalLayerFrontRequest) returns (ConvolutionalLayerFrontReply) {}
}

service Back {
    // #TODO: remove if working
    rpc Choice(ChoiceBiRequest) returns (ChoiceReply) {}
    rpc ConvolutionalLayer(ConvolutionalLayerBackRequest) returns (ConvolutionalLayerBackReply) {}
}

service Master {
    rpc NotifyActiveWorker(NotifyRequest) returns (NotifyReply) {}
    rpc NotifyDeactiveWorker(NotifyRequest) returns (NotifyReply) {}
    rpc NotifyPing(NotifyRequest) returns (NotifyReply) {}
}
